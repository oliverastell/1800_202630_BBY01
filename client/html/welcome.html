<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome | BCIT Campus Map</title>
  <link rel="icon" type="image/x-icon" href="/res/img/BCIT-logo.ico">
</head>
<body>
  <div id="welcome" class="position-relative h-100 w-100 bg-light rounded-4 z-3">
    <!-- Main content goes here -->
    <!-- This is the welcome on the landing page, with a login/signup button -->
    <div class="container">
      <div class=" px-4 py-5 my-5 text-center">
        <img class="d-block mx-auto mb-4" src="/res/img/BCIT-logo.ico" alt="" width="72" height="57">
        <h1 class="display-5 fw-bold">Welcome to BCIT Campus Map!</h1>
        <div class="col-lg-6 mx-auto">
          <p class="lead mb-4">The revolutionary tool for navigating the BCIT Burnaby campus.</p>
          <h2>Start using today!</h2>

          <div class="d-flex flex-row gap-3 justify-content-center">
            <div class="d-grid justify-content-sm-center">
              <!-- Make this button clickable, using onclick event listener -->
              <button id="login-or-signup" type="button"
                      class="btn btn-info btn-lg">Login/Signup</button>
            </div>

            <div class="d-grid justify-content-sm-center">
              <!-- Make this button clickable, using onclick event listener -->
              <button id="skip-signup" type="button"
                      class="btn btn-secondary btn-lg">Skip Signup</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/welcome.js"></script>
  <link rel="stylesheet" href="/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/res/css/index.css" />
</body>
</html>
