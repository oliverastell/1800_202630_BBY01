<!DOCTYPE html>
<html lang="en" class="w-100 h-100">

  <head>
    <!-- Pre DOM Linking-->
    <meta charset="UTF-8">
    <title>BBY Campus Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/res/img/BCIT-logo.ico">
    <link rel="stylesheet" href="/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="/res/css/index.css" />
    <!-- leaflet linking -->
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <!-- maptiler linking -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
  </head>

  <body class="m-0 overflow-hidden w-100 h-100">

    <div id="content" class="position-relative w-100 h-100">
      <div id="mapCanvasDiv" class="z-0 position-absolute w-100 h-100 top-0 start-0">
        <div id="map" class="w-100 h-100"></div>
      </div>

      <!-- Search bar -->
      <div id="searchBar" class="position-absolute bottom-0 start-0 end-0 z-1 p-3">
        <button id="searchBarButton" type="button"
          class="btn btn-light w-100 text-start text-secondary rounded-pill shadow border-0 px-4 py-2"
          >Search Location...</button>
      </div>
      
    <!--login  -->
    <div class="position-absolute top-0 end-0 m-3 z-2 d-flex flex-column-reverse align-items-end">
      <button id="login-button" type="button"
        class="btn btn-light shadow d-flex justify-content-center align-items-center gap-2"
        aria-label="Log in" title="Log in" disabled>
        <svg class="login-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
        </svg>
        <div class="login-status" hidden> 
          <span class="d-block m-auto">Signed in</span>
          <small class="d-block text-muted">click to sign out</small>
        </div>
        <svg class="logout-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" hidden>
          <path d="M9 5H5v14h4M9 12h12m-4-4 4 4-4 4" />
        </svg>
      </button>
      <span id="auth-status" class="visually-hidden" role="status" aria-live="polite"></span>
    </div>

      <!-- Search menu -->
      <div id="searchMenu"
        class="d-none position-absolute top-0 start-0 end-0 bottom-0 z-3 flex-column col-md-5 col-lg-4 shadow bg-dark-subtle border border-secondary rounded-4 overflow-hidden pb-3">
        <form id="searchForm" role="search" class="d-flex p-3 gap-2 flex-shrink-0">
          <input id="searchField" size="1" class="form-control flex-grow-1 rounded-pill border-dark bg-body-secondary text-dark px-3 py-2" type="search"
            placeholder="Search Location..." aria-label="Search">
          <button type="submit" class="btn btn-outline-dark rounded-pill bg-body-secondary flex-shrink-0 px-3">Search</button>
        </form>

        <p id="searchStatus" class="px-3 mb-2 text-dark" role="status" aria-live="polite"></p>
        <div id="searchMenuIcons" class="d-flex flex-wrap gap-1 px-3 pb-2 flex-shrink-0">
          <button type="button" class="btn p-1 border-0" aria-label="Red filter" onclick="searchFilter('red')">
            <svg height="40" width="40"><circle cx="20" cy="20" r="12" fill="red" /></svg>
          </button>
          <button type="button" class="btn p-1 border-0" aria-label="Blue filter" onclick="searchFilter('blue')">
            <svg height="40" width="40"><circle cx="20" cy="20" r="12" fill="blue" /></svg>
          </button>
          <button type="button" class="btn p-1 border-0" aria-label="Green filter" onclick="searchFilter('green')">
            <svg height="40" width="40"><circle cx="20" cy="20" r="12" fill="green" /></svg>
          </button>
          <button type="button" class="btn p-1 border-0" aria-label="Yellow filter" onclick="searchFilter('yellow')">
            <svg height="40" width="40"><circle cx="20" cy="20" r="12" fill="yellow" /></svg>
          </button>
        </div>
      <div id="searchMenuResults11" class="overflow-y-auto flex-shrink-1 mx-3 mt-2 px-3 pt-3 pb-4 rounded-5 bg-body-secondary" >
        <div class="d-flex align-items-center gap-2 mb-2">
          <p class="m-0 px-3 py-2 fs-5 text-center text-dark flex-grow-1">Recents</p>
          <button type=button class="btn border-0 rounded-pill flex-shrink-0" onclick="clearRecent()">Clear All</button>
        </div>

      <div id="searchMenuResults" class="list-group gap-2">
          <div class="list-group gap-2">

            <div class="list-group-item p-0 d-flex align-items-center gap-2 border-0 rounded-pill bg-light overflow-hidden recent-search-row">
              <button type="button" class=" btn list-group-item-action text-start text-dark text-break w-100 border-0 rounded-pill py-3 ps-3 pe-5 " onclick="searchRecent('SW1')">
                SW1
              </button>
              <button type=button class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action bookmark-toggle"><img src="../res/img/bookmark-icon.svg" width="20" height="24" alt="Bookmark Icon"></button>
              <button type="button" class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action" aria-label="Remove recent search" onclick="removeFromRecent(this)">X</button>
            </div>

            <div class="list-group-item p-0 d-flex align-items-center gap-2 border-0 rounded-pill bg-light overflow-hidden recent-search-row">
              <button type="button" class=" btn list-group-item-action text-start text-dark text-break w-100 border-0 rounded-pill py-3 ps-3 pe-5 " onclick="searchRecent('green circle 1')">
                Green circle 1
              </button>
              <button type=button class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action bookmark-toggle"><img src="../res/img/bookmark-icon.svg" width="20" height="24" alt="Bookmark Icon"></button>
              <button type="button" class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action" aria-label="Remove recent search" onclick="removeFromRecent(this)">X</button>
            </div>

            <div class="list-group-item p-0 d-flex align-items-center gap-2 border-0 rounded-pill bg-light overflow-hidden recent-search-row">
              <button type="button" class=" btn list-group-item-action text-start text-dark text-break w-100 border-0 rounded-pill py-3 ps-3 pe-5 " onclick="searchRecent('blue triangle 3')">
                Blue triangle 3
              </button>
              <button type=button class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action bookmark-toggle"><img src="../res/img/bookmark-icon.svg" width="20" height="24" alt="Bookmark Icon"></button>
              <button type="button" class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action" aria-label="Remove recent search" onclick="removeFromRecent(this)">X</button>
            </div>

            <div class="list-group-item p-0 d-flex align-items-center gap-2 border-0 rounded-pill bg-light overflow-hidden recent-search-row">
              <button type="button" class=" btn list-group-item-action text-start text-dark text-break w-100 border-0 rounded-pill py-3 ps-3 pe-5 " onclick="searchRecent('yellow rectangle 2')">
                Yellow rectangle 2
              </button>
              <button type=button class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action bookmark-toggle"><img src="../res/img/bookmark-icon.svg" width="20" height="24" alt="Bookmark Icon"></button>
              <button type="button" class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action" aria-label="Remove recent search" onclick="removeFromRecent(this)">X</button>
            </div>

            <div class="list-group-item p-0 d-flex align-items-center gap-2 border-0 rounded-pill bg-light overflow-hidden recent-search-row">
              <button type="button" class=" btn list-group-item-action text-start text-dark text-break w-100 border-0 rounded-pill py-3 ps-3 pe-5 " onclick="searchRecent('red circle 1')">
                Red circle 1
              </button>
              <button type=button class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action bookmark-toggle"><img src="../res/img/bookmark-icon.svg" width="20" height="24" alt="Bookmark Icon"></button>
              <button type="button" class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action" aria-label="Remove recent search" onclick="removeFromRecent(this)">X</button>
            </div>

            <div class="list-group-item p-0 d-flex align-items-center gap-2 border-0 rounded-pill bg-light overflow-hidden recent-search-row">
              <button type="button" class=" btn list-group-item-action text-start text-dark text-break w-100 border-0 rounded-pill py-3 ps-3 pe-5 " onclick="searchRecent('green square 1')">
                Green square 1
              </button>
              <button type=button class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action bookmark-toggle"><img src="../res/img/bookmark-icon.svg" width="20" height="24" alt="Bookmark Icon"></button>
              <button type="button" class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action" aria-label="Remove recent search" onclick="removeFromRecent(this)">X</button>
            </div>

            <div class="list-group-item p-0 d-flex align-items-center gap-2 border-0 rounded-pill bg-light overflow-hidden recent-search-row">
              <button type="button" class=" btn list-group-item-action text-start text-dark text-break w-100 border-0 rounded-pill py-3 ps-3 pe-5 " onclick="searchRecent('blue square 3')">
                Blue square 3
              </button>
              <button type=button class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action bookmark-toggle"><img src="../res/img/bookmark-icon.svg" width="20" height="24" alt="Bookmark Icon"></button>
              <button type="button" class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action" aria-label="Remove recent search" onclick="removeFromRecent(this)">X</button>
            </div>
            
            <div class="list-group-item p-0 d-flex align-items-center gap-2 border-0 rounded-pill bg-light overflow-hidden recent-search-row">
              <button type="button" class=" btn list-group-item-action text-start text-dark text-break w-100 border-0 rounded-pill py-3 ps-3 pe-5 " onclick="searchRecent('yellow circle 1')">
                Yellow circle 1
              </button>
              <button type=button class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action bookmark-toggle"><img src="../res/img/bookmark-icon.svg" width="20" height="24" alt="Bookmark Icon"></button>
              <button type="button" class="btn border-0 rounded-circle flex-shrink-0 p-0 recent-search-action" aria-label="Remove recent search" onclick="removeFromRecent(this)">X</button>
            </div>
          </div>
          </div>
        </div>
      </div>

      <!-- Bookmarks -->
      <div class="position-absolute bottom-0 end-0 m-3 z-2 d-flex flex-column-reverse align-items-end mb-5">
        <button id="bookmark-button" type="button"
          class="btn btn-light rounded-circle shadow p-0 d-flex justify-content-center align-items-center">
          <img src="../res/img/bookmark-icon.svg" class="object-fit-contain w-50 h-50" alt="Bookmarks">
        </button>
        <div id="bookmark-popup" class="bg-white p-3 rounded shadow mb-2" hidden>
          <h5 class="fw-bold mb-2">Bookmarks</h5>
        </div>
      </div>
    </div>

  <!-- Post DOM Linking -->
  <script type="module" src="/src/bookmarks.js"></script>
  <script type="module" src="/src/index.js"></script>
    <script type="module" src="/src/recents.js"></script>
  <script type="module" src="/src/homeAuth.js"></script>

</body>

</html>
