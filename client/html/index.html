<!DOCTYPE html>
<html lang="en" class="w-100 h-100">

<head>
  <!-- Pre DOM Linking-->
  <meta charset="UTF-8">
  <title>BBY Campus Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/res/img/BCIT-logo.ico">
  <link rel="stylesheet" href="/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="/res/css/index.css" />
</head>

<body class="m-0 overflow-hidden w-100 h-100">

  <div id="content" class="position-relative w-100 h-100">
    <div id="mapCanvasDiv" class="z-0 position-absolute top-0 end-0 bottom-0">
      <div id="map" class="w-100 h-100"></div>
    </div>


    <!--About location-->
    <section
        id="aboutLocation" class="popup-hidden position-absolute bottom-0 start-0 end-0 z-3 h-50
          bg-dark-subtle border border-secondary rounded-top-4 shadow px-3 pb-3 pt-0 overflow-y-auto"
        aria-labelledby="aboutLocationTitle" inert>
      <button type="button" id="aboutLocationDragHandle"
        class="location-drag-handle btn border-0 bg-transparent w-100 d-flex align-items-center justify-content-center p-0 mb-1"
        aria-label="Expand location details" aria-controls="aboutLocation" aria-expanded="false">
        <span class="d-block rounded-pill bg-secondary" aria-hidden="true"></span>
      </button>

      <!-- Context Panel -->
      <div class="d-flex flex-column w-100 gap-3">
        <!-- First row: bookmark, floors, title, X, etc. -->
        <div class="d-flex flex-row w-100 align-items-center justify-content-between">
          <!-- bookmark, floors -->
          <div class="d-flex flex-row gap-2">
            <button type="button" id="bookmarkSelectedLocation" aria-label="Bookmark this location" aria-pressed="false"
                    class="wh-50px btn border-0 btn-light rounded-circle shadow bookmark-toggle">
              <img class="w-100 h-100 ratio-1x1" src="../res/img/bookmark-icon.svg" alt="Bookmark Icon">
            </button>

            <button type="button" id="floorPlanButton" aria-label="Select floor" aria-controls="floorChooser" aria-expanded="false"
                    class="d-none wh-50px btn border-0 btn-light rounded-circle shadow">
              <img class="w-100 h-100 ratio-1x1" src="../res/img/floor-select-icon.svg" alt="">
            </button>

            <div class="d-flex align-items-center gap-1 flex-shrink-0">
              <div id="floorDropdown" class="dropdown d-none">
                <div id="floorChooser" class="dropdown-menu shadow" aria-labelledby="floorPlanButton"></div>
              </div>
            </div>
          </div>


          <!-- title -->
          <div class="d-flex flex-row flex-wrap">
            <h2 id="aboutLocationTitle" class="d-inline fs-5 text-dark text-break mb-0">
              About location
            </h2>
            <span id="selectedBookmarkEditor" class="ms-1"></span>
          </div>

          <!-- X -->
          <div class="d-flex flex-row">
            <button type="button" id="closeAboutLocation" aria-label="Close location details"
                    class="wh-50px btn border-0 btn-light rounded-circle shadow">
              <img class="w-100 h-100 ratio-1x1" src="../res/img/close-icon.svg" width="20" height="24" alt="">
            </button>
          </div>
        </div>

        <div id="roomSearch" hidden>
          <form id="roomsearchForm" role="search" aria-label="Room search" class="d-flex gap-2">
            <input id="roomsearchField" type="search" class="form-control rounded-pill" aria-label="Room number"
                   aria-describedby="roomSearchStatus" placeholder="Search room number" required>
            <button type="submit" class="btn btn-outline-dark rounded-pill">Search</button>
          </form>
          <div id="roomSearchStatus" class="small" role="status"></div>
        </div>

        <!-- Location metadata -->
        <div class="bg-body-secondary rounded-5 p-3">
          <dl class="mb-0">
            <div id="selectedLocationTypeRow" hidden>
              <dt class="small fw-semibold text-dark mb-1">Type</dt>
              <dd id="selectedLocationType" class="bg-light rounded-pill px-3 py-2 text-break mb-3"></dd>
            </div>
            <div id="selectedLocationDetailsRow" hidden>
              <dt class="small fw-semibold text-dark mb-1">Details</dt>
              <dd class="bg-light rounded-4 px-3 py-2 text-break mb-3">
                <ul id="selectedLocationDetails" class="mb-0 ps-3"></ul>
              </dd>
            </div>
            <div>
              <dt class="small fw-semibold text-dark mb-1">Latitude</dt>
              <dd class="bg-light rounded-pill px-3 py-2 text-break mb-3">
                <output id="selectedLatitude">—</output>
              </dd>
            </div>

            <div>
              <dt class="small fw-semibold text-dark mb-1">Longitude</dt>
              <dd class="bg-light rounded-pill px-3 py-2 text-break mb-0">
                <output id="selectedLongitude">—</output>
              </dd>
            </div>
          </dl>
        </div>
      </div>
    </section>

    <!--login  -->
    <div class="position-absolute top-0 end-0 m-3 z-2 d-flex flex-column-reverse align-items-end">
      <button id="login-button" type="button"
        class="btn btn-light shadow d-flex justify-content-center align-items-center gap-2" aria-label="Log in"
        title="Log in" disabled>
        <svg class="login-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
        </svg>
        <div class="login-status" hidden>
          <span class="d-block m-auto">Signed in</span>
          <small class="d-block text-muted">click to sign out</small>
        </div>
        <svg class="logout-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" hidden>
          <path d="M9 5H5v14h4M9 12h12m-4-4 4 4-4 4" />
        </svg>
      </button>
      <span id="auth-status" class="visually-hidden" role="status" aria-live="polite"></span>
    </div>

    <!-- Search menu -->
    <aside id="searchMenu" aria-label="Location search"
      class="position-absolute start-0 bottom-0 d-flex flex-column overflow-hidden bg-dark-subtle border border-secondary shadow pb-3">
      <button id="searchSheetHandle" type="button"
        class="location-drag-handle btn border-0 bg-transparent w-100 d-flex d-md-none align-items-center justify-content-center p-0 flex-shrink-0"
        aria-label="Expand search menu" aria-controls="searchMenu" aria-expanded="false">
        <span class="d-block rounded-pill bg-secondary" aria-hidden="true"></span>
      </button>
      <form id="searchForm" role="search" class="d-flex p-3 gap-2 flex-shrink-0">
        <input id="searchField" size="1"
          class="form-control flex-grow-1 rounded-pill border-dark bg-body-secondary text-dark px-3 py-2" type="search"
          placeholder="Search Location..." aria-label="Search">
        <button type="submit" id="submitSearch" aria-label="Search locations"
          class="btn btn-outline-dark rounded-pill bg-body-secondary flex-shrink-0 px-3">

          <img src="../res/img/search-icon.svg" class="object-fit-contain w-100 h-100" alt="">
        </button>
        <button id="closeSearchMenu" type="button"
          class="btn btn-outline-dark rounded-circle bg-body-secondary flex-shrink-0 d-md-none d-inline-flex align-items-center justify-content-center"
          aria-label="Close search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </form>


      <div class="d-flex gap-2 px-3 pb-2 flex-shrink-0 overflow-x-auto" aria-label="Search categories">
        <button id="washroomFilter" type="button"
          class="btn btn-light border rounded-pill shadow-sm d-inline-flex align-items-center gap-2 px-3 py-2 fw-semibold flex-shrink-0"
          aria-label="Show washrooms" aria-pressed="false"><span aria-hidden="true"><svg
              xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"
              aria-hidden="true">
              <circle cx="7" cy="4" r="2" />
              <circle cx="17" cy="4" r="2" />
              <path d="M4 7h6v7H8.5v7h-3v-7H4zM15 7h4l3 9h-3.5v5h-3v-5H12z" />
            </svg></span><span>Washroom</span></button>
        <button id="bookmarkPinFilter" type="button"
          class="btn btn-primary border rounded-pill shadow-sm d-inline-flex align-items-center gap-2 px-3 py-2 fw-semibold flex-shrink-0"
          aria-pressed="true">
          <img src="../res/img/bookmark-icon-filled.svg" width="16" height="20" alt="">
          <span>Bookmark pins</span>
        </button>
      </div>
      <p id="searchStatus" class="px-3 mb-2 text-dark" role="status" aria-live="polite"></p>
      <div id="searchMenuSearching" class="overflow-y-auto flex-shrink-1 mx-3 mt-2 px-3 pt-3 pb-4 rounded-5 bg-body-secondary" >
        <div id="searchMenuSearching2" class="list-group gap-2">

        </div>
      </div>


      <div id="searchMenuResults11" class="overflow-y-auto flex-shrink-1 mx-3 mt-2 px-3 pt-3 pb-4 rounded-5 bg-body-secondary">
        <div class="d-flex align-items-center gap-2 mb-2">
          <p class="m-0 px-3 py-2 fs-5 text-center text-dark flex-grow-1">Recents</p>
          <button type="button" class="btn border-0 rounded-pill flex-shrink-0 recent-search-clear"
            onclick="clearRecent()">Clear All</button>
        </div>

        <div id="searchMenuResults" class="list-group gap-2"></div>
      </div>
      <div id="searchResizeHandle" role="separator" tabindex="0" aria-orientation="vertical"
        class="position-absolute top-0 bottom-0 end-0 d-none d-md-flex align-items-center justify-content-center"
        aria-label="Search panel width" aria-controls="searchMenu">
        <span class="rounded-pill bg-secondary" aria-hidden="true"></span>
      </div>
    </aside>
    <div id="searchResizeGuide" class="position-absolute top-0 bottom-0 start-0 z-3 d-none pe-none bg-primary"
      aria-hidden="true"></div>

    <!-- Bookmarks -->
    <div id="bookmark-controls" class="position-absolute end-0 me-3 d-flex flex-column-reverse align-items-end">
      <button id="bookmark-button" type="button" aria-controls="bookmark-popup" aria-expanded="false"
        class="btn btn-light rounded-circle shadow p-0 d-flex justify-content-center align-items-center btn-lg">
        <img src="../res/img/bookmark-icon.svg" class="object-fit-contain w-50 h-50" alt="Bookmarks">
      </button>
      <div id="map-floor-control" class="position-relative mb-2">
        <button id="map-floor-button" type="button" aria-label="Default map floor"
          aria-controls="map-floor-popup" aria-expanded="false"
          class="btn btn-light rounded-circle shadow p-0 d-flex justify-content-center align-items-center btn-lg">
          <img src="../res/img/floor-select-icon.svg" class="object-fit-contain w-50 h-50" alt="">
        </button>
        <form id="map-floor-popup" class="position-absolute bottom-100 end-0 mb-2 p-3 rounded shadow bg-white" hidden>
          <label for="map-floor-select" class="form-label fw-semibold text-nowrap">Default map floor</label>
          <select id="map-floor-select" class="form-select">
            <option value="1">1st floor</option>
          </select>
          <button type="submit" class="btn btn-primary btn-sm mt-2">Apply</button>
        </form>
      </div>
      <div id="bookmark-popup" class="popup-hidden bg-white p-3 rounded shadow mb-2" inert>
        <h5 class="fw-bold mb-2">Bookmarks</h5>
      </div>
    </div>
  </div>

  <!-- Post DOM Linking -->
  <script type="module" src="/src/index.js"></script>
  <script type="module" src="/src/homeAuth.js"></script>

</body>

</html>
