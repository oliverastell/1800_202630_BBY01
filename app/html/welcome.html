<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome | BCIT Campus Map</title>
  <link rel="icon" type="image/x-icon" href="/img/BCIT-logo.ico">
</head>
<body>
  <main id="welcome" class="min-vh-100 d-flex align-items-center justify-content-center bg-body-tertiary px-3 py-5">
    <div class="card col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 rounded-4 shadow-sm text-center">
      <div class="card-body px-4 py-5 p-lg-5">
        <img class="d-block mx-auto mb-4 object-fit-contain" src="/img/bcit-logo.png" alt="" width="72" height="57">
        <h1 class="display-5 fw-bold lh-sm mb-3">Welcome to <span class="d-block">BCIT BBY Campus Map</span></h1>
        <p class="lead text-body-secondary mb-4">Find your way around the BCIT Burnaby campus.</p>
        <div class="d-grid d-sm-flex justify-content-sm-center gap-3">
          <button id="login-or-signup" class="btn btn-primary btn-lg" type="button">Login/Signup</button>
          <button id="skip-signup" class="btn btn-outline-secondary btn-lg" type="button">Skip Signup</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/welcome.js"></script>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
