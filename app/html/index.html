<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>BBY Campus Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/img/BCIT-logo.ico">
  <!-- Pre DOM Linking-->
  <link rel="stylesheet" href="/css/style.css">

  <script src="/js/bookmarks.js" defer></script>
</head>

<body>
  <main>
    <canvas id="mapCanvas" width="600" height="800" style="border:1px solid black"></canvas>
    <div class="bookmark-container">
      <button id="bookmark-button">
        <img src="/img/bookmark-icon.svg">
      </button>
      <div id="bookmark-popup" hidden>
        <h1>Bookmarks</h1>
      </div>
    </div>
  </main>

  <!-- Post DOM Linking -->
  <link rel="stylesheet" href="/css/bootstrap/bootstrap.min.css" />

</body>

</html>
