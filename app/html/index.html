<!DOCTYPE html>
<html lang="en" class="w-100 h-100">

  <head>
    <meta charset="UTF-8">
    <title>BBY Campus Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/img/BCIT-logo.ico">
    <!-- Pre DOM Linking-->
  </head>

  <body class="m-0 overflow-hidden w-100 h-100">

    <div id="content" class="position-relative w-100 h-100">
      <div id="mapCanvasDiv" class="z-0 position-absolute w-100 h-100 top-0 start-0">
        <canvas id="mapCanvas"></canvas>
      </div>

      <!-- Search bar -->
      <div id="searchBar" class="position-absolute top-0 start-0 end-0 z-1 p-3">
        <button id="searchBarButton" type="button"
          class="btn btn-light w-100 text-start text-secondary rounded-pill shadow border-0 px-4"
          onclick="clickSearch()">Search Location...</button>
      </div>

      <!-- Search menu -->
      <div id="searchMenu"
        class="d-none position-absolute top-0 start-0 end-0 bottom-0 z-3 flex-column col-md-5 col-lg-4 shadow" style="background-color: rgb(204, 204, 204);">
        <form id="searchForm" role="search" class="d-flex p-3 gap-2 flex-shrink-0">
          <input id="searchField" class="form-control" type="search"
            placeholder="Search Location..." aria-label="Search">
          <button type="submit" class="btn btn-outline-success">Search</button>
        </form>

        <div id="searchMenuIcons" class="d-flex gap-1 px-3 pb-2 border-bottom border-dark flex-shrink-0">
          <button type="button" class="btn p-1 border-0" aria-label="Red filter" onclick="searchFilter('red')">
            <svg height="40" width="40"><circle cx="20" cy="20" r="12" fill="red" /></svg>
          </button>
          <button type="button" class="btn p-1 border-0" aria-label="Blue filter" onclick="searchFilter('blue')">
            <svg height="40" width="40"><circle cx="20" cy="20" r="12" fill="blue" /></svg>
          </button>
          <button type="button" class="btn p-1 border-0" aria-label="Green filter" onclick="searchFilter('green')">
            <svg height="40" width="40"><circle cx="20" cy="20" r="12" fill="green" /></svg>
          </button>
          <button type="button" class="btn p-1 border-0" aria-label="Yellow filter" onclick="searchFilter('yellow')">
            <svg height="40" width="40"><circle cx="20" cy="20" r="12" fill="yellow" /></svg>
          </button>
        </div>

        <div id="searchMenuResults" class="overflow-y-auto flex-grow-1" >
          <p class="m-0 px-3 py-2 fw-semibold border-bottom">Recent</p>
          <div class="list-group list-group-flush">
            <button type="button" class="list-group-item list-group-item-action" onclick="searchRecent('red square 1')">Red square 1</button>
            <button type="button" class="list-group-item list-group-item-action" onclick="searchRecent('green circle 1')">Green circle 1</button>
            <button type="button" class="list-group-item list-group-item-action" onclick="searchRecent('blue triangle 3')">Blue triangle 3</button>
            <button type="button" class="list-group-item list-group-item-action" onclick="searchRecent('yellow rectangle 2')">Yellow rectangle 2</button>
            <button type="button" class="list-group-item list-group-item-action" onclick="searchRecent('red circle 1')">Red circle 1</button>
            <button type="button" class="list-group-item list-group-item-action" onclick="searchRecent('green square 1')">Green square 1</button>
            <button type="button" class="list-group-item list-group-item-action" onclick="searchRecent('blue square 3')">Blue square 3</button>
            <button type="button" class="list-group-item list-group-item-action" onclick="searchRecent('yellow circle 1')">Yellow circle 1</button>
          </div>
        </div>
      </div>

      <!-- Bookmarks -->
      <div class="position-absolute bottom-0 end-0 m-3 z-2 d-flex flex-column-reverse align-items-end">
        <button id="bookmark-button" type="button"
          class="btn btn-light rounded-circle shadow p-0 d-flex justify-content-center align-items-center">
          <img src="/img/bookmark-icon.svg" class="object-fit-contain w-50 h-50" alt="Bookmarks">
        </button>
        <div id="bookmark-popup" class="bg-white p-3 rounded shadow mb-2" hidden>
          <h5 class="fw-bold mb-2">Bookmarks</h5>
        </div>
      </div>
    </div>

    <!-- Post DOM Linking -->
    <link rel="stylesheet" href="/css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/index.css" />
    <script src="/js/bookmarks.js"></script>
    <script src="/js/index.js"></script>
  </body>

</html>
